[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mbfps"
version = "0.1.0"
description = "Model-Based First-Person Shooter Agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "vizdoom>=1.3.0",
    "gymnasium>=1.0",
    "numpy>=1.26",
    "opencv-python>=4.10",
    "transformers>=4.44",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: downloads model weights or runs a long benchmark"]
# This suite's fixtures write real checkpoints and episode data: measured,
# individual tests leave 269-413 MB in their `tmp_path` and one whole-suite run
# leaves ~20-24 GB. pytest's defaults (keep the last THREE session roots, and
# keep them whatever the outcome) therefore cost ~60 GB, and on 2026-09-26 that
# filled a 228 GB disk and killed three consecutive suite runs partway through
# -- as `OSError: <n> requested and 0 written` inside a fixture, after which
# pytest crashes in its own report formatter and prints no summary at all, so
# the runs looked like an unexplained wall of errors.
#
# `failed` deletes a passing test's directory as soon as it passes, which is
# where nearly all of the volume is, and keeps every failing test's directory
# -- the only ones worth opening. `1` keeps a single session root rather than
# three. Together they take a whole-suite run from ~24 GB resident to the
# failures alone.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
